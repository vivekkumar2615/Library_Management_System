{% extends "base.html" %}

{% block title %}
Admin Login
{% endblock %}

{% block content %}

<div class="auth-box">

    <h2>
        🔐 Admin Login
    </h2>

    <form method="POST">

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button class="btn primary full">
            Login
        </button>

    </form>


    <p class="hint">
        Username: admin<br>
        Password: admin123
    </p>

</div>

{% endblock %}
