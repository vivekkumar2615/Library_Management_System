<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Library Management System
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header class="navbar">

    <div class="brand">
        📚 Library Management System
    </div>

    {% if session.get('user') %}

    <nav>

        <a href="{{ url_for('dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('books') }}">
            Books
        </a>

        <a href="{{ url_for('students') }}">
            Students
        </a>

        <a href="{{ url_for('issue') }}">
            Issue / Return
        </a>

        <a class="logout"
           href="{{ url_for('logout') }}">
            Logout
        </a>

    </nav>

    {% endif %}

</header>


<main class="container">

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="flash">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    {% block content %}

    {% endblock %}

</main>

</body>

</html>
